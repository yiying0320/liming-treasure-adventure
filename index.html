<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><title>黎明尋寶小冒險</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:system-ui,sans-serif;background:#b8e8e8;color:#334d50}canvas{display:block}#hud{position:absolute;inset:0;pointer-events:none;padding:16px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}.pill,.box{background:#fffdf1eF;border:3px solid #fff;border-radius:20px;padding:10px 15px;box-shadow:0 5px 0 #79aaa480}h1{font-size:20px;margin:0}#mission{max-width:360px;font-weight:bold;line-height:1.5}#prompt{position:absolute;left:50%;bottom:105px;transform:translateX(-50%);text-align:center;display:none;white-space:nowrap}button{pointer-events:auto;border:0;border-radius:16px;background:#ffcc69;color:#604333;font-weight:800;padding:13px 19px;box-shadow:0 4px 0 #d89f47;font-size:16px;cursor:pointer}button:active{transform:translateY(3px);box-shadow:0 1px 0 #d89f47}#controls{position:absolute;bottom:18px;left:18px;display:grid;grid-template-columns:repeat(3,55px);gap:5px;pointer-events:auto;touch-action:none}#controls button{padding:12px}#action{position:absolute;right:18px;bottom:25px;background:#ff9291;box-shadow:0 4px 0 #d16f73}#modal{position:absolute;inset:0;background:#183f4699;display:flex;align-items:center;justify-content:center;padding:20px;pointer-events:auto}#modal .card{background:#fffdf2;border:5px solid white;border-radius:28px;max-width:480px;width:100%;padding:24px;box-shadow:0 10px 0 #3f7979;text-align:center;line-height:1.7}#modal h2{margin:0;color:#df7777}#modal p{white-space:pre-line}#photos{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;max-height:210px;overflow:auto;margin:10px 0}#photos img{width:100%;height:65px;object-fit:cover;border-radius:8px;cursor:pointer}#modal video{width:100%;max-height:240px;border-radius:12px;display:none}#mutebtn{position:absolute;right:15px;top:15px;background:#fffdf1;font-size:14px;padding:9px 12px}small{font-size:12px}
</style></head><body><div id="hud"><div class="pill"><h1>🌼 黎明尋寶小冒險</h1><small>卡通原型・路線非實景比例</small></div><div class="box" id="mission">尋找黎明小聚前的金色星星！</div><div id="prompt" class="pill">✨ 按空白鍵或「互動」</div><div id="controls"><span></span><button data-k="w">▲</button><span></span><button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button></div><button id="action">✨ 互動</button><button id="mutebtn">🔊 音效開</button></div><div id="modal"><div class="card"><h2 id="title">🌼 黎明尋寶小冒險</h2><p id="story">從黎明小聚出發，尋找散落在村子裡的回憶星星！\n\n用方向鍵或 WASD 走路；手機用左下角按鈕。靠近閃亮物件後按空白鍵或互動。\n\n這是可玩的想像版原型，街景與黎明溝終點之後會依你的照片和路線調整。</p><div id="photos"></div><video id="video" controls playsinline></video><button id="close">出發！</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const scene=new THREE.Scene(); scene.background=new THREE.Color('#bfe8f0');scene.fog=new THREE.Fog('#bfe8f0',32,85);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,150);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x82aa75,2));let sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-12,25,15);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-35;sun.shadow.camera.right=35;sun.shadow.camera.top=35;sun.shadow.camera.bottom=-35;scene.add(sun);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.8});function cube(x,y,z,w,h,d,c){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}function ball(x,y,z,r,c){let o=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),mat(c));o.position.set(x,y,z);o.castShadow=true;scene.add(o);return o}
cube(0,-.35,-21,45,.5,75,'#a8db95');cube(0,-.05,-21,7,.12,70,'#e8d7ae');for(let z=8;z>-52;z-=4)cube(0,.025,z,.13,.03,1.4,'#fff5dc');
function house(x,z,color,sign){cube(x,1.6,z,5,3.2,4,color);let roof=cube(x,3.5,z,5.6,.7,4.5,'#e9897a');roof.rotation.z=x<0?.07:-.07;cube(x,1,z+2.04,1.1,2,.1,'#a36f5c');cube(x+(x<0?1.55:-1.55),1.9,z+2.05,1.1,.9,.1,'#a4d9e1');if(sign){let cvs=document.createElement('canvas');cvs.width=512;cvs.height=128;let c=cvs.getContext('2d');c.fillStyle='#fff8de';c.fillRect(0,0,512,128);c.fillStyle='#ab6260';c.font='bold 55px sans-serif';c.textAlign='center';c.fillText(sign,256,83);let tex=new THREE.CanvasTexture(cvs);let s=new THREE.Mesh(new THREE.PlaneGeometry(3.8,.95),new THREE.MeshBasicMaterial({map:tex}));s.position.set(x,2.95,z+2.32);scene.add(s)}}
house(-6,4,'#ffe1b4','黎明小聚');house(6,-18,'#ffd0c0','伴伴');for(let z=-5;z>-45;z-=10){house(-7,z,'#fff0d0');if(z!==-15)house(8,z,'#d4eddf')}
function tree(x,z){cube(x,.85,z,.38,1.7,.38,'#aa8061');ball(x,2.25,z,1.15,'#81c88a');ball(x+.6,2.3,z,.8,'#a3dd94')}for(let z=7;z>-50;z-=7){tree(-11,z);tree(12,z-2)}cube(0,-.12,-47,22,.18,5,'#77cdd0');for(let x=-9;x<10;x+=2)cube(x,.01,-47,.8,.05,.1,'#c4f6ed');
let player=new THREE.Group();let body=new THREE.Mesh(new THREE.SphereGeometry(.55,16,12),mat('#ffc4ab'));body.position.y=1.05;player.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.48,16,12),mat('#ffe4c5'));head.position.y=1.9;player.add(head);let hair=new THREE.Mesh(new THREE.SphereGeometry(.49,16,12,0,Math.PI*2,0,Math.PI*.45),mat('#72524b'));hair.position.y=2;player.add(hair);for(let x of [-.22,.22]){let leg=new THREE.Mesh(new THREE.BoxGeometry(.23,.55,.28),mat('#9f7971'));leg.position.set(x,.3,0);player.add(leg)}scene.add(player);player.position.set(0,0,7);
const missions=[{x:-2,z:4,title:'⭐ 第一顆回憶星',text:'黎明小聚出發！沿著小路尋找伴伴。\n\n點照片可以放大，這些是你記錄的村中風景。',next:'前往伴伴，尋找午餐線索！'},{x:3,z:-16,title:'🍜 午餐線索',text:'找到伴伴了！香噴噴的午餐補充了冒險能量。\n\n點照片看看伴伴門口的回憶。',next:'往黎明溝前進，尋找最後的寶藏！'},{x:0,z:-43,title:'🎁 找到寶藏了！',text:'恭喜完成黎明新村的尋寶散步！\n\n點照片回顧水邊與小鳥。\n實際路線和場景會等照片與終點位置確認後更新。',next:'🎉 任務完成！可以繼續逛逛。'}];let index=0;let stars=[];for(let m of missions){let g=new THREE.Group();let s=new THREE.Mesh(new THREE.OctahedronGeometry(.65),new THREE.MeshStandardMaterial({color:'#ffce52',emissive:'#e49b24',emissiveIntensity:.55}));g.add(s);g.position.set(m.x,1.25,m.z);scene.add(g);stars.push(g)}
let keys={};let modal=document.querySelector('#modal'), audio, muted=false;function tone(f=600){if(muted)return;audio ||= new AudioContext();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),gain=audio.createGain();o.type='sine';o.frequency.value=f;gain.gain.setValueAtTime(.09,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.2);o.connect(gain).connect(audio.destination);o.start();o.stop(audio.currentTime+.2)}function close(){modal.style.display='none';document.querySelector('#video').pause();document.querySelector('#photos').replaceChildren();tone(440)}document.querySelector('#close').onclick=close;document.querySelector('#mutebtn').onclick=e=>{muted=!muted;e.target.textContent=muted?'🔇 音效關':'🔊 音效開';if(!muted)tone()};function interact(){if(modal.style.display!=='none')return;let m=missions[index];if(!m||Math.hypot(player.position.x-m.x,player.position.z-m.z)>2.7)return;tone(720);setTimeout(()=>tone(960),110);stars[index].visible=false;document.querySelector('#title').textContent=m.title;document.querySelector('#story').textContent=m.text;let gallery=document.querySelector('#photos');gallery.replaceChildren();let groups=[[5,6,7,8,9,13],[2,3,10,11],[1,4,12]];for(let n of groups[index]){let a=document.createElement('a');a.href='photos/'+n+'.jpg';a.target='_blank';a.rel='noopener';let im=document.createElement('img');im.src=a.href;im.alt='旅途照片 '+n;a.append(im);gallery.append(a)}document.querySelector('#close').textContent=index===2?'繼續散步':'繼續冒險';document.querySelector('#mission').textContent=m.next;index++;modal.style.display='flex'}document.querySelector('#action').onclick=interact;addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();if(e.key===' ')interact()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true});for(let event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>keys[k]=false)});addEventListener('blur',()=>keys={});
let clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.05);if(modal.style.display==='none'){let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),z=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(x||z){let l=Math.hypot(x,z);player.position.x=THREE.MathUtils.clamp(player.position.x+x/l*5*dt,-4,4);player.position.z=THREE.MathUtils.clamp(player.position.z+z/l*5*dt,-48,10);player.rotation.y=Math.atan2(x,z)}}camera.position.lerp(new THREE.Vector3(player.position.x+9,13,player.position.z+16),.06);camera.lookAt(player.position.x,0,player.position.z-4);stars.forEach((s,i)=>{s.rotation.y+=dt*2;s.position.y=1.3+Math.sin(performance.now()/350+i)*.2});let m=missions[index];document.querySelector('#prompt').style.display=m&&Math.hypot(player.position.x-m.x,player.position.z-m.z)<2.7?'block':'none';renderer.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
