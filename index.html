</style></head><body><div id="hud"><div class="pill"><h1>🌼 黎明尋寶小冒險</h1><small>卡通原型・路線非實景比例</small></div><div class="box" id="mission">先到左側巷弄，尋找出發線索！</div><div id="prompt" class="pill">✨ 按空白鍵或「互動」</div><div id="controls"><span></span><button data-k="w">▲</button><span></span><button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button></div><button id="action">✨ 互動</button><button id="mutebtn">🔊 音效開</button></div><div id="modal"><div class="card"><h2 id="title">🌼 黎明尋寶小冒險</h2><p id="story">從黎明小聚出發，探索轉彎巷弄，尋找散落在村子裡的回憶星星！\n\n用方向鍵或 WASD 走路；手機用左下角按鈕。靠近閃亮物件後按空白鍵或互動。\n\n路障留有缺口，記得繞路！每個線索都要回答小問題，才能繼續冒險。</p><div id="photos"></div><video id="video" controls playsinline></video><button id="close">出發！</button></div></div>

scene.add(new THREE.HemisphereLight(0xffffff,0x82aa75,2));let sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-12,25,15);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-35;sun.shadow.camera.right=35;sun.shadow.camera.top=35;sun.shadow.camera.bottom=-35;scene.add(sun);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.8});function cube(x,y,z,w,h,d,c){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}function ball(x,y,z,r,c){let o=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),mat(c));o.position.set(x,y,z);o.castShadow=true;scene.add(o);return o}
cube(0,-.35,-21,45,.5,75,'#a8db95');cube(0,-.05,-21,7,.12,70,'#e8d7ae');for(let z of [3,-7,-16,-27,-38,-44])cube(0,-.035,z,26,.13,4,'#e8d7ae');cube(-9,-.04,-2,4,.13,16,'#e8d7ae');cube(9,-.04,-22,4,.13,24,'#e8d7ae');cube(-9,-.04,-38,4,.13,16,'#e8d7ae');for(let z=8;z>-52;z-=4)cube(0,.025,z,.13,.03,1.4,'#fff5dc');
function house(x,z,color,sign){cube(x,1.6,z,5,3.2,4,color);let roof=cube(x,3.5,z,5.6,.7,4.5,'#e9897a');roof.rotation.z=x<0?.07:-.07;cube(x,1,z+2.04,1.1,2,.1,'#a36f5c');cube(x+(x<0?1.55:-1.55),1.9,z+2.05,1.1,.9,.1,'#a4d9e1');if(sign){let cvs=document.createElement('canvas');cvs.width=512;cvs.height=128;let c=cvs.getContext('2d');c.fillStyle='#fff8de';c.fillRect(0,0,512,128);c.fillStyle='#ab6260';c.font='bold 55px sans-serif';c.textAlign='center';c.fillText(sign,256,83);let tex=new THREE.CanvasTexture(cvs);let s=new THREE.Mesh(new THREE.PlaneGeometry(3.8,.95),new THREE.MeshBasicMaterial({map:tex}));s.position.set(x,2.95,z+2.32);scene.add(s)}}
house(-6,4,'#ffe1b4','黎明小聚');house(6,-18,'#ffd0c0','伴伴');for(let z=-5;z>-45;z-=10){house(-7,z,'#fff0d0');if(z!==-15)house(8,z,'#d4eddf')}

let player=new THREE.Group();let body=new THREE.Mesh(new THREE.SphereGeometry(.55,16,12),mat('#ffc4ab'));body.position.y=1.05;player.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.48,16,12),mat('#ffe4c5'));head.position.y=1.9;player.add(head);let hair=new THREE.Mesh(new THREE.SphereGeometry(.49,16,12,0,Math.PI*2,0,Math.PI*.45),mat('#72524b'));hair.position.y=2;player.add(hair);for(let x of [-.22,.22]){let leg=new THREE.Mesh(new THREE.BoxGeometry(.23,.55,.28),mat('#9f7971'));leg.position.set(x,.3,0);player.add(leg)}scene.add(player);player.position.set(0,0,7);
const missions=[{x:-7,z:4,title:'🪴 植物巷的秘密',text:'沿路發現綠色的植物與村中小店。\n點照片可以放大。',question:'線索一：植物通常長出什麼？\n1. 葉子　2. 輪胎',answer:'1',next:'繞過第一排綠籬的右側缺口，去尋找下一個線索！'},{x:8,z:-7,title:'📚 巷弄尋寶',text:'找到街角和書本造型的寶物！',question:'線索二：想閱讀故事，可以打開什麼？\n1. 書　2. 石頭',answer:'1',next:'從第二排綠籬的左側缺口繞路，前往伴伴！'},{x:-7,z:-16,title:'🍜 伴伴午餐',text:'找到伴伴了！看看你拍的店面和招牌。',question:'線索三：這家店的名字是？\n1. 伴伴　2. 花花',answer:'1',next:'繞過第三排綠籬右側，尋找水果的秘密！'},{x:8,z:-28,title:'🍈 水果小任務',text:'街角的水果攤藏著一顆回憶星。',question:'線索四：哪一個是水果？\n1. 芭樂　2. 鞋子',answer:'1',next:'穿過第四排綠籬左側缺口，往水邊前進！'},{x:-7,z:-43,title:'🎁 黎明溝寶藏',text:'恭喜走過彎彎的巷弄！來看看水邊與小鳥的照片。\n實際場景與路線仍是示意。',question:'最後一題：照片中水裡有什麼？\n1. 小魚　2. 公車',answer:'1',next:'🎉 任務完成！可以繼續散步。'}];let index=0;let stars=[];for(let m of missions){let g=new THREE.Group();let s=new THREE.Mesh(new THREE.OctahedronGeometry(.65),new THREE.MeshStandardMaterial({color:'#ffce52',emissive:'#e49b24',emissiveIntensity:.55}));g.add(s);g.position.set(m.x,1.25,m.z);scene.add(g);stars.push(g)}
let keys={};let modal=document.querySelector('#modal'), audio, muted=false;function tone(f=600){if(muted)return;audio ||= new AudioContext();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),gain=audio.createGain();o.type='sine';o.frequency.value=f;gain.gain.setValueAtTime(.09,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.2);o.connect(gain).connect(audio.destination);o.start();o.stop(audio.currentTime+.2)}function close(){modal.style.display='none';document.querySelector('#video').pause();document.querySelector('#photos').replaceChildren();tone(440)}document.querySelector('#close').onclick=close;document.querySelector('#mutebtn').onclick=e=>{muted=!muted;e.target.textContent=muted?'🔇 音效關':'🔊 音效開';if(!muted)tone()};function interact(){if(modal.style.display!=='none')return;let m=missions[index];if(!m||Math.hypot(player.position.x-m.x,player.position.z-m.z)>2.7)return;let answer=window.prompt(m.question+'\n請輸入 1 或 2：');if(answer===null)return;if(answer.trim()!==m.answer){tone(220);alert('再觀察一下，試試另一個答案！');return}tone(720);setTimeout(()=>tone(960),110);stars[index].visible=false;document.querySelector('#title').textContent=m.title;document.querySelector('#story').textContent=m.text;let gallery=document.querySelector('#photos');gallery.replaceChildren();let groups=[[5,6,13],[8,9],[2,3,10,11],[7],[1,4,12]];for(let n of groups[index]){let a=document.createElement('a');a.href='photos/'+n+'.jpg';a.target='_blank';a.rel='noopener';let im=document.createElement('img');im.src=a.href;im.alt='旅途照片 '+n;a.append(im);gallery.append(a)}document.querySelector('#close').textContent=index===missions.length-1?'繼續散步':'繼續冒險';document.querySelector('#mission').textContent=m.next;index++;modal.style.display='flex'}document.querySelector('#action').onclick=interact;addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();if(e.key===' ')in let clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.05);if(modal.style.display==='none'){let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),z=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(x||z){let l=Math.hypot(x,z);let nx=THREE.MathUtils.clamp(player.position.x+x/l*5*dt,-12,12),nz=THREE.MathUtils.clamp(player.position.z+z/l*5*dt,-48,10);if(!barriers.some(b=>nx>b.from-.55&&nx<b.to+.55&&Math.abs(nz-b.z)<1.05)){player.position.x=nx;player.position.z=nz}player.rotation.y=Math.atan2(x,z)}}camera.position.lerp(new THREE.Vector3(player.position.x+9,13,player.position.z+16),.06);camera.lookAt(player.position.x,0,player.position.z-4);stars.forEach((s,i)=>{s.rotation.y+=dt*2;s.position.y=1.3+Math.sin(performance.now()/350+i)*.2});let m=missions[index];document.querySelector('#prompt').style.display=m&&Math.hypot(player.position.x-m.x,player.position.z-m.z)<2.7?'block':'none';renderer.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
